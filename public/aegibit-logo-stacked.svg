<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="AEGIBIT">
  <title>AEGIBIT</title>
  <defs>
    <linearGradient id="aegibit-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7C7CC"/>
    </linearGradient>
    <linearGradient id="aegibit-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- "A" mark centered horizontally, top half -->
  <g transform="translate(44, 40) scale(1.0)">
    <path d="M256 84 L122 430 L194 430 L256 168 Z"
          fill="url(#aegibit-white)"
          stroke="url(#aegibit-white)" stroke-width="14" stroke-linejoin="round"/>
    <path d="M256 84 L390 430 L318 430 L256 168 Z"
          fill="url(#aegibit-orange)"
          stroke="url(#aegibit-orange)" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark below — AEGI white, BIT orange -->
  <text x="300" y="700"
        text-anchor="middle"
        font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="400"
        font-size="118"
        letter-spacing="12">
    <tspan fill="#FFFFFF">AEGI</tspan><tspan fill="#F97316">BIT</tspan>
  </text>
</svg>
