<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" role="img" aria-label="AEGIBIT">
  <title>AEGIBIT</title>
  <defs>
    <linearGradient id="aegibit-white" x1="0.05" y1="0" x2="0.55" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDEDF0"/>
      <stop offset="100%" stop-color="#C2C2C9"/>
    </linearGradient>
    <linearGradient id="aegibit-orange" x1="0.05" y1="0" x2="0.45" y2="1">
      <stop offset="0%" stop-color="#FFB061"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#E05B04"/>
    </linearGradient>
  </defs>

  <!-- "A" mark centered horizontally, top -->
  <g transform="translate(44, 40) scale(1.0)">
    <path d="M286 100 L224 130 L124 426 L196 426 Z"
          fill="url(#aegibit-white)" stroke="url(#aegibit-white)" stroke-width="16" stroke-linejoin="round"/>
    <path d="M272 162 L328 182 L388 426 L322 426 Z"
          fill="url(#aegibit-orange)" stroke="url(#aegibit-orange)" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark below — AEGI white, BIT orange -->
  <text x="300" y="700"
        text-anchor="middle"
        font-family="Geist, Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-weight="400"
        font-size="118"
        letter-spacing="12">
    <tspan fill="#FFFFFF">AEGI</tspan><tspan fill="#F97316">BIT</tspan>
  </text>
</svg>
