<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AEGIBIT">
  <title>AEGIBIT</title>
  <defs>
    <!-- White leg: subtle top-light → soft-grey sheen, matches the brand reference -->
    <linearGradient id="aegibit-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7C7CC"/>
    </linearGradient>
    <!-- Orange leg: canonical brand orange with a lighter top edge -->
    <linearGradient id="aegibit-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <!-- Black rounded square — keeps the mark crisp on every browser theme -->
  <rect width="512" height="512" rx="96" fill="#000000"/>

  <!-- The AEGIBIT "A": two angled strokes, no crossbar. Left leg white,
       right leg orange. Strokes meet at a solid peak and splay open at
       the base. stroke-* on each path softens the corners. -->
  <path d="M256 84 L122 430 L194 430 L256 168 Z"
        fill="url(#aegibit-white)"
        stroke="url(#aegibit-white)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 84 L390 430 L318 430 L256 168 Z"
        fill="url(#aegibit-orange)"
        stroke="url(#aegibit-orange)" stroke-width="14" stroke-linejoin="round"/>
</svg>
