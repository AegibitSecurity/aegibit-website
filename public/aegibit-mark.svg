<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AEGIBIT">
  <title>AEGIBIT</title>
  <defs>
    <linearGradient id="aegibit-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7C7CC"/>
    </linearGradient>
    <linearGradient id="aegibit-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.14"/>
      <stop offset="65%" stop-color="#F97316" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft halo behind the mark -->
  <circle cx="256" cy="256" r="230" fill="url(#halo)"/>

  <!-- The AEGIBIT "A": two angled strokes, no crossbar.
       Left leg white, right leg orange. -->
  <path d="M256 84 L122 430 L194 430 L256 168 Z"
        fill="url(#aegibit-white)"
        stroke="url(#aegibit-white)" stroke-width="14" stroke-linejoin="round"/>
  <path d="M256 84 L390 430 L318 430 L256 168 Z"
        fill="url(#aegibit-orange)"
        stroke="url(#aegibit-orange)" stroke-width="14" stroke-linejoin="round"/>
</svg>
